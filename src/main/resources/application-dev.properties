spring.application.name=Trackery-BackAPIServer
spring.data.rest.basePath=${BASE_PATH}
logging.level.org.springframework.security=debug
logging.level.com.trackery.trackerybackapiserver.domain.location=debug

server.port=${SERVER_PORT}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Naver OAuth
oauth.naver.client-id=${NAVER_CLIENT_ID}
oauth.naver.client-secret=${NAVER_CLIENT_SECRET}
oauth.naver.redirect-uri=${NAVER_REDIRECT_URI}
oauth.naver.auth-uri=${NAVER_OAUTH}
oauth.naver.token-uri=https://nid.naver.com/oauth2.0/token
oauth.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

# Kakao OAuth
oauth.kakao.client-id=${KAKAO_CLIENT_ID}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
oauth.kakao.auth-uri=${KAKAO_OAUTH}
oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# Google OAuth
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI}
oauth.google.auth-uri=${GOOGLE_OAUTH}
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Github OAuth
oauth.github.client-id=${GITHUB_CLIENT_ID}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET}
oauth.github.redirect-uri=${GITHUB_REDIRECT_URI}
oauth.github.auth-uri=${GITHUB_OAUTH}
oauth.github.token-uri=https://github.com/login/oauth/access_token
oauth.github.user-info-uri=https://api.github.com/user

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# AWS
aws.region=${AWS_REGION}
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL}

# PageHelper
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.params=count=countSql
pagehelper.default-count=true
pagehelper.page-size-zero=false
